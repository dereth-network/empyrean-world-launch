# Builds and publishes a world release from a tag.
#
# To release: build the world with the pinned converter (`empyrean-import ac1999 --revision <source>
# --allow-incomplete --out <bundle>`, then `ac1999 package`), set `version`, the pins and `[pack]
# sha256` in release.toml, the version's section of CHANGES.md and releases/v<version>/, commit to main
# and push main, then tag `v<version>` on Forgejo and push the tag there. The mirror carries it here,
# and this workflow does the rest. Tags always start on Forgejo, so the mirror can't prune them. The
# workflow must already be on main when the tag arrives: a push that first adds it starts no run.
# Nothing here pushes to any repository; it only makes the release.
#
# It refuses to publish when the pack's hash differs from release.toml's, or when what it built with
# isn't what release.toml pins. Running it by hand on main is a dry run: the same builds and checks,
# the files kept as a workflow artifact for 7 days, nothing published.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: build and check
    # A forge that also reads this folder has no converter to build and nowhere to publish.
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      tag: ${{ steps.pin.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Read release.toml, and the tag names its version
        id: pin
        run: python3 .github/workflows/release-check.py pin

      - name: The tag is on main
        if: github.ref_type == 'tag'
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: dereth-network/dereth
          ref: ${{ steps.pin.outputs.commit }}
          path: converter
          persist-credentials: false

      - name: Build the converter
        env:
          TOOLCHAIN: ${{ steps.pin.outputs.toolchain }}
        working-directory: converter
        run: |
          rustup toolchain install "$TOOLCHAIN" --profile minimal
          cargo "+$TOOLCHAIN" build --release --locked -p empyrean-import

      - name: Convert and package
        env:
          REVISION: ${{ steps.pin.outputs.revision }}
        run: |
          converter/target/release/empyrean-import ac1999 --revision "$REVISION" --allow-incomplete --out bundle
          converter/target/release/empyrean-import ac1999 package --bundle bundle --out release

      - name: Refuse anything but what release.toml states
        env:
          TOOLCHAIN: ${{ steps.pin.outputs.toolchain }}
        run: |
          rustc_said=$(cd converter && rustc "+$TOOLCHAIN" -V)
          python3 .github/workflows/release-check.py verify converter release "$rustc_said" bundle
          (cd release && sha256sum -c SHA256SUMS)

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: world-release
          path: release
          if-no-files-found: error
          retention-days: 7

  publish:
    name: publish
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: world-release
          path: release

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
        run: |
          # --verify-tag: never let the release make a tag here that the mirror would prune.
          # Not a draft and not a prerelease: the importer follows the newest published release.
          notes=release/release-notes.md
          mv "$notes" notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --latest \
            --title "$TAG" --notes-file notes.md release/*
